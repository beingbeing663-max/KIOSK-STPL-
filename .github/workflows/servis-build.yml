name: Build ServisSlipKiosk exe
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller pyzk pandas openpyxl pywin32 pillow
      - run: python -m PyInstaller --onefile --noconsole --name ServisSlipKiosk --hidden-import zk --hidden-import win32print --hidden-import win32ui --hidden-import win32con slip_kiosk_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: ServisSlipKiosk
          path: dist/ServisSlipKiosk.exe
